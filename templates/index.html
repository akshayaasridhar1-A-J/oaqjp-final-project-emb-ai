<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Feedback Emotion Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 44px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #1a1a2e; font-size: 24px; margin-bottom: 8px; }
        p  { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        textarea {
            width: 100%; height: 110px; padding: 12px;
            border: 2px solid #e5e7eb; border-radius: 10px;
            font-size: 14px; resize: vertical;
            font-family: inherit;
        }
        textarea:focus { border-color: #667eea; outline: none; }
        button {
            margin-top: 14px; width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #loader {
            display: none; text-align: center;
            padding: 16px; color: #6b7280;
        }
        #errorMsg {
            display: none; margin-top: 14px; padding: 12px;
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 8px; color: #dc2626; font-size: 14px;
        }
        #resultPanel {
            display: none; margin-top: 24px; padding: 20px;
            background: #f9fafb; border-radius: 12px;
        }
        .dominant-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 16px;
            font-size: 18px; font-weight: bold;
        }
        .bar-row {
            display: flex; align-items: center;
            gap: 10px; margin: 8px 0;
        }
        .bar-label { width: 80px; font-size: 13px; color: #4b5563; }
        .bar-track {
            flex: 1; height: 10px; background: #e5e7eb;
            border-radius: 10px; overflow: hidden;
        }
        .bar-fill {
            height: 100%; border-radius: 10px;
            width: 0%; transition: width .7s ease;
        }
        .anger   { background: #ef4444; }
        .disgust { background: #84cc16; }
        .fear    { background: #8b5cf6; }
        .joy     { background: #f59e0b; }
        .sadness { background: #3b82f6; }
        .bar-score {
            width: 44px; font-size: 12px;
            color: #6b7280; text-align: right;
        }
        #summaryText {
            margin-top: 16px; padding: 12px;
            border-left: 4px solid #667eea;
            background: #fff; font-size: 13px;
            color: #374151; line-height: 1.7;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Customer Feedback Emotion Detector</h1>
    <p>Powered by IBM Watson NLP — Analyze emotions in feedback.</p>
    <textarea id="textToAnalyze"
        placeholder="e.g. I absolutely love this product.">
    </textarea>
    <button id="analyzeBtn" onclick="RunSentimentAnalysis()">
        Analyze Emotion
    </button>
    <div id="loader">Analyzing with Watson NLP...</div>
    <div id="errorMsg"></div>
    <div id="resultPanel">
        <div class="dominant-box" id="dominantBox">-</div>
        <div class="bar-row">
            <span class="bar-label">Anger</span>
            <div class="bar-track">
                <div class="bar-fill anger" id="bar-anger"></div>
            </div>
            <span class="bar-score" id="score-anger">0.000</span>
        </div>
        <div class="bar-row">
            <span class="bar-label">Disgust</span>
            <div class="bar-track">
                <div class="bar-fill disgust" id="bar-disgust"></div>
            </div>
            <span class="bar-score" id="score-disgust">0.000</span>
        </div>
        <div class="bar-row">
            <span class="bar-label">Fear</span>
            <div class="bar-track">
                <div class="bar-fill fear" id="bar-fear"></div>
            </div>
            <span class="bar-score" id="score-fear">0.000</span>
        </div>
        <div class="bar-row">
            <span class="bar-label">Joy</span>
            <div class="bar-track">
                <div class="bar-fill joy" id="bar-joy"></div>
            </div>
            <span class="bar-score" id="score-joy">0.000</span>
        </div>
        <div class="bar-row">
            <span class="bar-label">Sadness</span>
            <div class="bar-track">
                <div class="bar-fill sadness" id="bar-sadness"></div>
            </div>
            <span class="bar-score" id="score-sadness">0.000</span>
        </div>
        <div id="summaryText"></div>
    </div>
</div>
<script src="/static/mywebscript.js"></script>
</body>
</html>
